<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PORTAL MODERNISASI AHMAD</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="sidebar">
    <h2>MENU PORTAL</h2>
    <a href="#" onclick="show('home')">🏠 Halaman Utama</a>
    <a href="#" onclick="show('musik')">🎵 Musik Player</a>
    <a href="#" onclick="show('galeri')">📸 Galeri & Status</a>
</div>

<div id="main">
    <div class="header">
        <button class="menu-btn" onclick="toggle()">☰</button>
        <h2 id="title" style="margin-left:20px; font-size: 1.1rem; color: #1a1a2e;">HALAMAN UTAMA</h2>
    </div>

    <div id="home" class="section active">
        <div class="card">
            <h3>Halo, Ahmad!</h3>
            <p>Selamat datang di portal modernisasi. Sistem ini kini berjalan dengan struktur file yang terpisah.</p>
        </div>
    </div>

    <div id="musik" class="section">
        <div class="card">
            <h3>Pemutar Musik Modern</h3>
            <p>Memuat playlist dari folder 'm'...</p>
        </div>
    </div>

    <div id="galeri" class="section">
        <div class="card">
            <h4>Update Status</h4>
            <textarea id="txt" rows="3" placeholder="Apa yang ingin kamu sampaikan?"></textarea>
            <input type="file" id="img" accept="image/*" style="margin-top:10px">
            <button class="post-btn" onclick="post()">POSTING</button>
        </div>
        <div id="feed"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
